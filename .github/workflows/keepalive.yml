# Supabase free-tier pauses a project after ~7 days without activity, and this
# demo is linked from live Upwork proposals — a paused project means a client
# clicks a dead demo. So: sign in as the demo viewer twice a week and read one
# row. That both counts as activity AND fails loudly if the demo login breaks.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       https://<ref>.supabase.co
#   SUPABASE_ANON_KEY  the anon/publishable key (public by design)
#   DEMO_PASSWORD      password for viewer@vantage.demo
#
# ponytail: GitHub disables scheduled workflows in a repo with no activity for
# 60 days (it emails first; one click re-enables). If the repo goes fully
# dormant, run this workflow manually or push anything to reset that clock.

name: Keepalive

on:
  schedule:
    - cron: "17 2 * * 1,4" # Mon & Thu 02:17 UTC — twice a week, well inside 7 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in as the demo viewer, then read one row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          set -euo pipefail

          payload=$(jq -n --arg p "$DEMO_PASSWORD" \
            '{email: "viewer@vantage.demo", password: $p}')

          token=$(curl -sS -X POST \
            "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" | jq -r '.access_token // empty')

          if [ -z "$token" ]; then
            echo "::error::demo sign-in failed — the live demo is broken or the project is paused"
            exit 1
          fi

          # RLS grants SELECT to `authenticated` only, so this needs the session
          # token: it exercises auth + RLS + REST, the whole demo path.
          code=$(curl -sS -o /tmp/rows -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $token")

          echo "products query: HTTP $code"
          if [ "$code" -ge 400 ]; then
            cat /tmp/rows
            exit 1
          fi
